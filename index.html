<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trip Expense Manager</title>

<style>
:root{
  --primary:#4f46e5;
  --primary-dark:#3730a3;
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  color:var(--primary);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card h2{
  margin-top:0;
  font-size:20px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-weight:600;
}

input,
select,
button{
  width:100%;
  padding:12px;
  border-radius:10px;
  font-size:15px;
}

input,
select{
  border:1px solid var(--line);
  background:#fff;
}

button{
  border:0;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  background:var(--primary-dark);
}

button.secondary{
  background:#e5e7eb;
  color:#111827;
}

button.danger{
  background:var(--red);
}

button.green{
  background:var(--green);
}

button.orange{
  background:var(--orange);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab-button{
  flex:1;
  background:#e5e7eb;
  color:#374151;
}

.tab-button.active{
  background:var(--primary);
  color:white;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* =========================
   SUMMARY
========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.summary-box{
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  background:#fafafa;
}

.summary-box .title{
  color:var(--muted);
  font-size:13px;
}

.summary-box .value{
  font-size:22px;
  font-weight:700;
  margin-top:5px;
}

.balance-positive{
  color:var(--green);
}

.balance-negative{
  color:var(--red);
}

/* =========================
   PEOPLE / HISTORY
========================= */

.person-row,
.history-row,
.settlement-row{
  border-bottom:1px solid var(--line);
  padding:12px 0;
}

.person-row:last-child,
.history-row:last-child,
.settlement-row:last-child{
  border-bottom:0;
}

.person-name{
  font-weight:700;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.amount{
  font-weight:700;
}

.history-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.delete-btn{
  width:auto;
  padding:7px 12px;
  font-size:12px;
  background:var(--red);
}

.settlement-row{
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  background:#fafafa;
}

.settlement-row:hover{
  background:#eef2ff;
}

.settlement-arrow{
  color:var(--primary);
  font-weight:700;
}

/* =========================
   STATUS
========================= */

.status{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  display:none;
  font-size:14px;
}

.status.show{
  display:block;
}

.status.success{
  background:#dcfce7;
  color:#166534;
}

.status.error{
  background:#fee2e2;
  color:#991b1b;
}

/* =========================
   LOADER
========================= */

.loader-overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(3px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loader-overlay.show{
  display:flex;
}

.loader-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px 30px;
  min-width:210px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

.spinner{
  width:42px;
  height:42px;
  margin:0 auto 14px;
  border:4px solid #e5e7eb;
  border-top:4px solid var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

#loaderText{
  font-size:14px;
  font-weight:650;
  color:var(--ink);
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<!-- =========================
     LOADER
========================= -->

<div id="loader" class="loader-overlay">
  <div class="loader-box">
    <div class="spinner"></div>
    <div id="loaderText">Please wait...</div>
  </div>
</div>


<div class="container">

  <h1>💰 Trip Expense Manager</h1>


  <!-- =========================
       TABS
  ========================= -->

  <div class="tabs">

    <button
      class="tab-button active"
      id="expenseTabBtn"
      type="button"
      onclick="openTab('expenseTab')">
      💰 Add Expense
    </button>

    <button
      class="tab-button"
      id="paymentTabBtn"
      type="button"
      onclick="openTab('paymentTab')">
      💸 Record Payment
    </button>

  </div>


  <!-- =========================
       ADD EXPENSE TAB
  ========================= -->

  <div id="expenseTab" class="tab-content active">

    <div class="card">

      <h2>💰 Add Expense</h2>

      <form id="expenseForm">

        <label>Description</label>
        <input
          type="text"
          id="description"
          placeholder="Example: Hotel, Food, Petrol"
          required
        >

        <div class="row">

          <div>
            <label>Amount</label>
            <input
              type="number"
              id="amount"
              min="0"
              step="0.01"
              placeholder="₹0"
              required
            >
          </div>

          <div>
            <label>Date</label>
            <input
              type="date"
              id="expenseDate"
              required
            >
          </div>

        </div>

        <label>Paid By</label>
        <select id="paidBy" required>
          <option value="">Select person</option>
        </select>

        <br><br>

        <div class="row">

          <button type="submit">
            💾 Save Expense
          </button>

          <button
            type="button"
            class="secondary"
            onclick="clearExpenseForm()">
            Clear
          </button>

        </div>

        <div id="expenseStatus" class="status"></div>

      </form>

    </div>

  </div>


  <!-- =========================
       PAYMENT TAB
  ========================= -->

  <div id="paymentTab" class="tab-content">

    <div class="card">

      <h2>💸 Record Payment</h2>

      <form id="paymentForm">

        <label>Date</label>

        <input
          type="date"
          id="paymentDate"
          required
        >


        <div class="row">

          <div>

            <label>From</label>

            <select id="paymentFrom" required>
              <option value="">Select person</option>
            </select>

          </div>


          <div>

            <label>To</label>

            <select id="paymentTo" required>
              <option value="">Select person</option>
            </select>

          </div>

        </div>


        <label>Payment Amount</label>

        <input
          type="number"
          id="paymentAmount"
          min="0"
          step="0.01"
          placeholder="₹0"
          required
        >


        <br>

        <button
          type="submit"
          class="green">
          💸 Record Payment
        </button>


        <div id="paymentStatus" class="status"></div>

      </form>

    </div>

  </div>


  <!-- =========================
       SUMMARY
  ========================= -->

  <div class="card">

    <h2>📊 Trip Summary</h2>

    <div class="summary-grid">

      <div class="summary-box">

        <div class="title">
          Total Expenses
        </div>

        <div
          class="value"
          id="totalExpenses">
          ₹0
        </div>

      </div>


      <div class="summary-box">

        <div class="title">
          Total Payments
        </div>

        <div
          class="value"
          id="totalPayments">
          ₹0
        </div>

      </div>

    </div>


    <br>

    <div id="balances"></div>

  </div>


  <!-- =========================
       SUGGESTED SETTLEMENT
  ========================= -->

  <div class="card">

    <h2>🤝 Suggested Settlement</h2>

    <div class="small">
      Tap a settlement to record the payment.
    </div>

    <br>

    <div id="settlementList">
      No settlement required.
    </div>

  </div>


  <!-- =========================
       EXPENSE HISTORY
  ========================= -->

  <div class="card">

    <h2>📋 Expense History</h2>

    <div id="expenseHistory">
      No expenses found.
    </div>

  </div>


  <!-- =========================
       PAYMENT HISTORY
  ========================= -->

  <div class="card">

    <h2>💳 Payment History</h2>

    <div id="paymentHistory">
      No payments found.
    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyY08hSSzmnsbYQqWMu72w-LniYOxdvB2IlgF-cuo5c5XAr6HeHsA28gDGiiH9iVtmKEA/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

let people = [];

let expenses = [];

let payments = [];


/* =========================================================
   HELPER
========================================================= */

function $(id){
  return document.getElementById(id);
}


/* =========================================================
   LOADER
========================================================= */

function showLoader(message = "Please wait..."){

  $("loaderText").textContent = message;

  $("loader").classList.add("show");

}


function hideLoader(){

  $("loader").classList.remove("show");

}


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(elementId,message,type){

  const el = $(elementId);

  el.textContent = message;

  el.className = "status show " + type;

}


function hideStatus(elementId){

  const el = $(elementId);

  el.className = "status";

  el.textContent = "";

}


/* =========================================================
   TAB CONTROL
========================================================= */

function openTab(tabId){

  document.querySelectorAll(".tab-content")
    .forEach(tab => tab.classList.remove("active"));

  document.querySelectorAll(".tab-button")
    .forEach(btn => btn.classList.remove("active"));


  $(tabId).classList.add("active");


  if(tabId === "expenseTab"){

    $("expenseTabBtn").classList.add("active");

  }

  if(tabId === "paymentTab"){

    $("paymentTabBtn").classList.add("active");

  }

}


/* =========================================================
   DATE
========================================================= */

function today(){

  const d = new Date();

  const month =
    String(d.getMonth()+1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${d.getFullYear()}-${month}-${day}`;

}


/* =========================================================
   INITIAL LOAD
========================================================= */

window.addEventListener("load",function(){

  $("expenseDate").value = today();

  $("paymentDate").value = today();

  loadData();

});


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  showLoader("Loading trip data...");


  try{

    const response =
      await fetch(API_URL + "?action=list");

    const data =
      await response.json();


    if(data.people && data.people.length === 5){

      people = data.people;

    }


    expenses =
      Array.isArray(data.expenses)
      ? data.expenses
      : [];


    payments =
      Array.isArray(data.payments)
      ? data.payments
      : [];


    renderPaidBy();

    renderPaymentPeople();

    renderAll();


  }catch(error){

    console.error(error);

    alert(
      "Unable to load trip data. Please check your internet connection."
    );


  }finally{

    hideLoader();

  }

}


/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPaidBy(){

  const select = $("paidBy");

  select.innerHTML =
    '<option value="">Select person</option>';


  people.forEach(person => {

    const option =
      document.createElement("option");

    option.value = person;

    option.textContent = person;

    select.appendChild(option);

  });

}


/* =========================================================
   PAYMENT PEOPLE
========================================================= */

function renderPaymentPeople(){

  const from =
    $("paymentFrom");

  const to =
    $("paymentTo");


  from.innerHTML =
    '<option value="">Select person</option>';

  to.innerHTML =
    '<option value="">Select person</option>';


  people.forEach(person => {

    const option1 =
      document.createElement("option");

    option1.value = person;

    option1.textContent = person;

    from.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = person;

    option2.textContent = person;

    to.appendChild(option2);

  });

}


/* =========================================================
   ADD EXPENSE
========================================================= */

$("expenseForm").addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const description =
      $("description").value.trim();

    const amount =
      Number($("amount").value);

    const date =
      $("expenseDate").value;

    const paidBy =
      $("paidBy").value;


    if(!description || !amount || !date || !paidBy){

      showStatus(
        "expenseStatus",
        "Please fill all fields.",
        "error"
      );

      return;

    }


    showLoader("Saving expense...");

    hideStatus("expenseStatus");


    try{

      const expense = {

        id:
          "EXP-" + Date.now(),

        date:
          date,

        description:
          description,

        amount:
          amount,

        paidBy:
          paidBy

      };


      const response =
        await fetch(API_URL,{

          method:"POST",

          body:JSON.stringify({

            action:"add",

            expense:expense,

            people:people

          })

        });


      const result =
        await response.json();


      if(!result.success){

        throw new Error(
          result.message ||
          "Unable to save expense."
        );

      }


      showStatus(
        "expenseStatus",
        "Expense saved successfully.",
        "success"
      );


      clearExpenseForm();

      await loadData();


    }catch(error){

      console.error(error);

      showStatus(
        "expenseStatus",
        error.message ||
        "Unable to save expense.",
        "error"
      );


    }finally{

      hideLoader();

    }

  }
);


/* =========================================================
   CLEAR EXPENSE FORM
========================================================= */

function clearExpenseForm(){

  $("description").value = "";

  $("amount").value = "";

  $("paidBy").value = "";

  $("expenseDate").value = today();

}


/* =========================================================
   ADD PAYMENT
========================================================= */

$("paymentForm").addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const date =
      $("paymentDate").value;

    const from =
      $("paymentFrom").value;

    const to =
      $("paymentTo").value;

    const amount =
      Number($("paymentAmount").value);


    if(!date || !from || !to || !amount){

      showStatus(
        "paymentStatus",
        "Please fill all fields.",
        "error"
      );

      return;

    }


    if(from === to){

      showStatus(
        "paymentStatus",
        "From and To person cannot be the same.",
        "error"
      );

      return;

    }


    showLoader("Recording payment...");

    hideStatus("paymentStatus");


    try{

      const payment = {

        id:
          "PAY-" + Date.now(),

        date:
          date,

        from:
          from,

        to:
          to,

        amount:
          amount

      };


      const response =
        await fetch(API_URL,{

          method:"POST",

          body:JSON.stringify({

            action:"addPayment",

            payment:payment

          })

        });


      const result =
        await response.json();


      if(!result.success){

        throw new Error(
          result.message ||
          "Unable to record payment."
        );

      }


      showStatus(
        "paymentStatus",
        "Payment recorded successfully.",
        "success"
      );


      $("paymentAmount").value = "";


      await loadData();


    }catch(error){

      console.error(error);

      showStatus(
        "paymentStatus",
        error.message ||
        "Unable to record payment.",
        "error"
      );


    }finally{

      hideLoader();

    }

  }
);


/* =========================================================
   DELETE EXPENSE
========================================================= */

async function deleteExpense(id){

  if(!confirm(
    "Are you sure you want to delete this expense?"
  )){

    return;

  }


  showLoader("Deleting expense...");


  try{

    const response =
      await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

          action:"delete",

          id:id

        })

      });


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Unable to delete expense."
      );

    }


    await loadData();


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Unable to delete expense."
    );


  }finally{

    hideLoader();

  }

}


/* =========================================================
   DELETE PAYMENT
========================================================= */

async function deletePayment(id){

  if(!confirm(
    "Are you sure you want to delete this payment?"
  )){

    return;

  }


  showLoader("Deleting payment...");


  try{

    const response =
      await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

          action:"deletePayment",

          id:id

        })

      });


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Unable to delete payment."
      );

    }


    await loadData();


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Unable to delete payment."
    );


  }finally{

    hideLoader();

  }

}


/* =========================================================
   CALCULATE BALANCES
========================================================= */

function calculateBalances(){

  const balances = {};


  people.forEach(person => {

    balances[person] = 0;

  });


  /*
    Expense:
    Every person owes equal share.
    Person who paid gets full amount credit.
  */

  expenses.forEach(expense => {

    const amount =
      Number(expense.amount) || 0;

    const share =
      amount / people.length;


    people.forEach(person => {

      balances[person] -= share;

    });


    if(
      Object.prototype.hasOwnProperty.call(
        balances,
        expense.paidBy
      )
    ){

      balances[expense.paidBy] += amount;

    }

  });


  /*
    Payment:
    From person has paid money.
    To person receives money.
  */

  payments.forEach(payment => {

    const amount =
      Number(payment.amount) || 0;


    if(
      Object.prototype.hasOwnProperty.call(
        balances,
        payment.from
      )
    ){

      balances[payment.from] += amount;

    }


    if(
      Object.prototype.hasOwnProperty.call(
        balances,
        payment.to
      )
    ){

      balances[payment.to] -= amount;

    }

  });


  return balances;

}


/* =========================================================
   RENDER SUMMARY
========================================================= */

function renderSummary(){

  const totalExpenses =
    expenses.reduce(
      (sum,e) =>
        sum + Number(e.amount || 0),
      0
    );


  const totalPayments =
    payments.reduce(
      (sum,p) =>
        sum + Number(p.amount || 0),
      0
    );


  $("totalExpenses").textContent =
    formatMoney(totalExpenses);


  $("totalPayments").textContent =
    formatMoney(totalPayments);


  const balances =
    calculateBalances();


  const container =
    $("balances");


  container.innerHTML = "";


  people.forEach(person => {

    const balance =
      balances[person] || 0;


    const row =
      document.createElement("div");

    row.className =
      "person-row";


    let balanceClass = "";

    let message = "";


    if(balance > 0.01){

      balanceClass =
        "balance-positive";

      message =
        "should receive";

    }else if(balance < -0.01){

      balanceClass =
        "balance-negative";

      message =
        "needs to pay";

    }else{

      message =
        "settled";

    }


    row.innerHTML = `

      <div class="person-name">
        ${escapeHtml(person)}
      </div>

      <div class="${balanceClass}">
        ${formatMoney(Math.abs(balance))}
        ${message}
      </div>

    `;


    container.appendChild(row);

  });

}


/* =========================================================
   SETTLEMENT CALCULATION
========================================================= */

function calculateSettlements(){

  const balances =
    calculateBalances();


  const creditors = [];

  const debtors = [];


  Object.keys(balances).forEach(person => {

    const amount =
      Number(balances[person] || 0);


    if(amount > 0.01){

      creditors.push({

        person:person,

        amount:amount

      });

    }


    if(amount < -0.01){

      debtors.push({

        person:person,

        amount:Math.abs(amount)

      });

    }

  });


  creditors.sort(
    (a,b) => b.amount - a.amount
  );

  debtors.sort(
    (a,b) => b.amount - a.amount
  );


  const settlements = [];


  let i = 0;

  let j = 0;


  while(
    i < debtors.length &&
    j < creditors.length
  ){

    const amount =
      Math.min(
        debtors[i].amount,
        creditors[j].amount
      );


    if(amount > 0.01){

      settlements.push({

        from:
          debtors[i].person,

        to:
          creditors[j].person,

        amount:
          amount

      });

    }


    debtors[i].amount -= amount;

    creditors[j].amount -= amount;


    if(debtors[i].amount <= 0.01){

      i++;

    }


    if(creditors[j].amount <= 0.01){

      j++;

    }

  }


  return settlements;

}


/* =========================================================
   RENDER SETTLEMENT
========================================================= */

function renderSettlements(){

  const container =
    $("settlementList");


  const settlements =
    calculateSettlements();


  if(!settlements.length){

    container.innerHTML =
      '<div class="small">No settlement required 🎉</div>';

    return;

  }


  container.innerHTML = "";


  settlements.forEach(settlement => {

    const row =
      document.createElement("div");

    row.className =
      "settlement-row";


    row.innerHTML = `

      <div>

        <strong>
          ${escapeHtml(settlement.from)}
        </strong>

        <span class="settlement-arrow">
          →
        </span>

        <strong>
          ${escapeHtml(settlement.to)}
        </strong>

      </div>

      <div class="amount">
        ${formatMoney(settlement.amount)}
      </div>

    `;


    row.onclick = function(){

      useSettlement(
        settlement.from,
        settlement.to,
        settlement.amount
      );

    };


    container.appendChild(row);

  });

}


/* =========================================================
   USE SETTLEMENT
========================================================= */

function useSettlement(
  from,
  to,
  amount
){

  openTab("paymentTab");


  $("paymentFrom").value =
    from;


  $("paymentTo").value =
    to;


  $("paymentAmount").value =
    Number(amount).toFixed(2);


  $("paymentDate").value =
    today();


  showStatus(
    "paymentStatus",
    "Settlement details filled. Click Record Payment.",
    "success"
  );


  document
    .getElementById("paymentTab")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================================================
   RENDER EXPENSE HISTORY
========================================================= */

function renderExpenseHistory(){

  const container =
    $("expenseHistory");


  if(!expenses.length){

    container.innerHTML =
      '<div class="small">No expenses found.</div>';

    return;

  }


  container.innerHTML = "";


  const sorted =
    [...expenses].reverse();


  sorted.forEach(expense => {

    const row =
      document.createElement("div");

    row.className =
      "history-row";


    row.innerHTML = `

      <div class="history-header">

        <div>

          <strong>
            ${escapeHtml(expense.description)}
          </strong>

          <div class="small">

            ${escapeHtml(expense.date || "")}

            • Paid by
            ${escapeHtml(expense.paidBy || "")}

          </div>

        </div>


        <div>

          <div class="amount">
            ${formatMoney(expense.amount)}
          </div>

          <button
            class="delete-btn"
            onclick="deleteExpense('${escapeHtml(expense.id)}')">
            Delete
          </button>

        </div>

      </div>

    `;


    container.appendChild(row);

  });

}


/* =========================================================
   RENDER PAYMENT HISTORY
========================================================= */

function renderPaymentHistory(){

  const container =
    $("paymentHistory");


  if(!payments.length){

    container.innerHTML =
      '<div class="small">No payments found.</div>';

    return;

  }


  container.innerHTML = "";


  const sorted =
    [...payments].reverse();


  sorted.forEach(payment => {

    const row =
      document.createElement("div");

    row.className =
      "history-row";


    row.innerHTML = `

      <div class="history-header">

        <div>

          <strong>

            ${escapeHtml(payment.from)}

            →
            ${escapeHtml(payment.to)}

          </strong>


          <div class="small">

            ${escapeHtml(payment.date || "")}

          </div>

        </div>


        <div>

          <div class="amount">

            ${formatMoney(payment.amount)}

          </div>


          <button
            class="delete-btn"
            onclick="deletePayment('${escapeHtml(payment.id)}')">
            Delete
          </button>

        </div>

      </div>

    `;


    container.appendChild(row);

  });

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderSummary();

  renderSettlements();

  renderExpenseHistory();

  renderPaymentHistory();

}


/* =========================================================
   MONEY FORMAT
========================================================= */

function formatMoney(value){

  return "₹" +
    Number(value || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
